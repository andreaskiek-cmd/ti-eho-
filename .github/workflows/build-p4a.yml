name: Build TI EHO APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git \
            zip \
            unzip \
            autoconf \
            automake \
            libtool \
            pkg-config \
            zlib1g-dev \
            libncurses5 \
            libncurses5-dev \
            libffi-dev \
            libssl-dev

      - name: Install python-for-android
        run: |
          python -m pip install --upgrade pip
          python -m pip install python-for-android

      - name: Build APK
        run: |
          p4a apk \
            --private . \
            --package=org.tieho \
            --name="TI EHO" \
            --version=1.0 \
            --numeric-version=1 \
            --bootstrap=sdl2 \
            --requirements=python3,kivy \
            --arch=arm64-v8a \
            --orientation=portrait \
            --permission=INTERNET \
            --debug

      - name: Find APK
        run: |
          echo "APK files:"
          find . -type f -name "*.apk" -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TI-EHO-APK
          path: "**/*.apk"
          if-no-files-found: error

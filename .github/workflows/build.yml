name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: |
            platform-tools
            platforms;android-35
            build-tools;35.0.0
            ndk;28.2.13676358

      - name: Fix Buildozer SDK path
        run: |
          SDK="$ANDROID_SDK_ROOT"

          echo "SDK: $SDK"

          mkdir -p "$HOME/sdk-tools/bin"

          ln -sf "$SDK/cmdline-tools/16.0/bin/sdkmanager" "$HOME/sdk-tools/bin/sdkmanager"

          echo "sdkmanager:"
          "$HOME/sdk-tools/bin/sdkmanager" --version

          echo "Build tools:"
          ls -la "$SDK/build-tools"

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip
          python -m pip install buildozer
          python -m pip install cython==0.29.37

      - name: Build APK
        env:
          ANDROID_HOME: ${{ env.ANDROID_SDK_ROOT }}
          ANDROID_SDK_ROOT: ${{ env.ANDROID_SDK_ROOT }}
          PATH: ${{ env.HOME }}/sdk-tools/bin:${{ env.ANDROID_SDK_ROOT }}/platform-tools:${{ env.ANDROID_SDK_ROOT }}/cmdline-tools/16.0/bin:${{ env.PATH }}
        run: |
          buildozer -v android debug

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: tieho-apk
          path: bin/*.apk

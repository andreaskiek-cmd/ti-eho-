name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: >-
            platform-tools
            platforms;android-35
            build-tools;35.0.0
            ndk;28.2.13676358

      - name: Fix old Buildozer sdkmanager path
        run: |
          SDK="$ANDROID_SDK_ROOT"

          echo "ANDROID_SDK_ROOT=$SDK"
          echo "ANDROID_HOME=$ANDROID_HOME"

          mkdir -p "$SDK/tools/bin"

          if [ -x "$SDK/cmdline-tools/latest/bin/sdkmanager" ]; then
            ln -sf "$SDK/cmdline-tools/latest/bin/sdkmanager" "$SDK/tools/bin/sdkmanager"
          elif [ -x "$SDK/cmdline-tools/16.0/bin/sdkmanager" ]; then
            ln -sf "$SDK/cmdline-tools/16.0/bin/sdkmanager" "$SDK/tools/bin/sdkmanager"
          else
            echo "ERROR: sdkmanager was not found"
            find "$SDK" -name sdkmanager -type f -print
            exit 1
          fi

          chmod +x "$SDK/tools/bin/sdkmanager"

          "$SDK/tools/bin/sdkmanager" --version

          yes | "$SDK/tools/bin/sdkmanager" --licenses >/dev/null || true

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip
          python -m pip install buildozer cython==0.29.37

      - name: Build APK
        env:
          P4A_RELEASE_QUIET: "1"
        run: |
          buildozer -v android debug

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: tieho-apk
          path: bin/*.apk

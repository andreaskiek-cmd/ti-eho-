name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git \
            zip \
            unzip \
            autoconf \
            automake \
            autopoint \
            gettext \
            libtool \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            libtinfo6 \
            cmake \
            libffi-dev \
            libssl-dev

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Accept Android licenses
        run: |
          yes | sdkmanager --licenses || true

      - name: Fix Buildozer sdkmanager path
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"

          mkdir -p "$ANDROID_HOME/tools"

          rm -rf "$ANDROID_HOME/tools/bin"

          ln -s "$ANDROID_HOME/cmdline-tools/latest/bin" \
            "$ANDROID_HOME/tools/bin"

          echo "Checking sdkmanager:"
          ls -l "$ANDROID_HOME/tools/bin/sdkmanager"

          "$ANDROID_HOME/tools/bin/sdkmanager" --version

      - name: Configure Buildozer SDK path
        run: |
          sed -i '/^[[:space:]]*android\.sdk_path[[:space:]]*=/d' buildozer.spec

          sed -i '/^\[app\]/a android.sdk_path = /usr/local/lib/android/sdk' buildozer.spec

          echo "Buildozer SDK configuration:"
          grep "android.sdk_path" buildozer.spec

      - name: Verify Android SDK
        run: |
          test -f "$ANDROID_HOME/tools/bin/sdkmanager"
          test -f "$ANDROID_HOME/build-tools/35.0.0/aidl"
          test -d "$ANDROID_HOME/platforms/android-35"

          echo "================================"
          echo "SDKMANAGER FOUND"
          echo "AIDL FOUND"
          echo "ANDROID API 35 FOUND"
          echo "================================"

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip
          pip install buildozer==1.6.0

      - name: Build APK
        run: |
          buildozer -v android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ti-eho-apk
          path: bin/*.apk
          if-no-files-found: error

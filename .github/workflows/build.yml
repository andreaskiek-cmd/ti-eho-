name: Build Android APK

on:
  workflow_dispatch:

env:
  PYTHONFORANDROID_PREREQUISITES_INSTALL_INTERACTIVE: "0"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.x"

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip
          python -m pip install buildozer

      - name: Prepare Buildozer
        run: |
          sed -i '/^[[:space:]]*android\.sdk_path[[:space:]]*=/d' buildozer.spec
          sed -i '/^[[:space:]]*android\.ndk_path[[:space:]]=/d' buildozer.spec
          sed -i '/^[[:space:]]*android\.skip_update[[:space:]]=/d' buildozer.spec

          if grep -q '^android.accept_sdk_license' buildozer.spec; then
            sed -i 's/^android.accept_sdk_license.*/android.accept_sdk_license = True/' buildozer.spec
          else
            sed -i '/^\[app\]/a android.accept_sdk_license = True' buildozer.spec
          fi

          if grep -q '^p4a.branch' buildozer.spec; then
            sed -i 's/^p4a.branch.*/p4a.branch = develop/' buildozer.spec
          else
            sed -i '/^\[app\]/a p4a.branch = develop' buildozer.spec
          fi

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y automake libltdl-dev

      - name: Download Android SDK NDK and p4a
        run: |
          buildozer android p4a -- --help

      - name: Build APK
        run: |
          buildozer -v android debug

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: tieho-apk
          path: bin/*.apk
          if-no-files-found: error
